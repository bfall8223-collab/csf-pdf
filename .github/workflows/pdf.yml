name: Make PDF

on:
  repository_dispatch:
    types: [csf-pdf]
  workflow_dispatch:
    inputs:
      url: { description: "Page URL", required: true }
      id:  { description: "WordPress post ID", required: true }

concurrency:
  group: csf-pdf-${{ github.event.client_payload.id || inputs.id }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: ${{ github.event.client_payload.url || inputs.url }}
      ID:  ${{ github.event.client_payload.id || inputs.id }}
      KEY: ${{ secrets.CSF_UPLOAD_KEY }}
      # Case studies send their own receiving addresses (CSF Case Study Editorial plugin); Insight Reports use the defaults.
      UPLOAD: ${{ github.event.client_payload.upload }}
      FAIL: ${{ github.event.client_payload.fail }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Build PDF (retries once)
        run: node render.js "$URL" report.pdf || (sleep 20 && node render.js "$URL" report.pdf)
      - name: Send PDF to WordPress (retries once)
        run: |
          SITE=$(node -e "console.log(new URL(process.env.URL).origin)")
          for i in 1 2; do
            curl -fsS -X POST -H "X-CSF-Key: $KEY" -H "Content-Type: application/pdf" \
              --data-binary @report.pdf "${UPLOAD:-$SITE/wp-json/csf-pdf/v1/upload}?id=$ID" && exit 0
            echo "upload failed" > error.txt; sleep 15
          done
          exit 1
      - name: Tell WordPress what went wrong
        if: failure()
        run: |
          SITE=$(node -e "console.log(new URL(process.env.URL).origin)")
          MSG=$(cat error.txt 2>/dev/null || echo "build step failed")
          curl -sS -X POST -H "X-CSF-Key: $KEY" -H "Content-Type: text/plain" \
            --data-binary "$MSG" "${FAIL:-$SITE/wp-json/csf-pdf/v1/fail}?id=$ID" || true
